<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; color: #333; }
        h1 { font-size: 2em; margin-bottom: 10px; }
        p { color: #666; }
        .icon { font-size: 4em; color: #ccc; margin-bottom: 20px; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>No Internet Connection</h1>
    <p>You are currently offline. Some features may not be available.</p>
    <p>Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
